<!doctype html>
<html><head><meta charset="utf-8"><title>Aurelia - logo reveal</title><link rel="stylesheet" href="/engine/ms.css"></head>
<body>
<script src="/__spec.js"></script>
<script src="/engine/ms.js"></script>
<script>
/* AURELIA - 7 s logo reveal (style: luxury, motion: cinematic).
   Anticipation (gold dust drifts, a light line draws) -> the monogram draws itself, fills with gold, a light sweep
   crosses it -> wordmark tracks in -> long clean hold (the last 2 s double as the thumbnail). */
MS.boot(C => {
  const u = C.u;
  const MARK = `<svg viewBox="0 0 200 200">
    <defs><linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6e2a0"/><stop offset=".45" stop-color="#c9a24f"/><stop offset=".7" stop-color="#f1d78c"/><stop offset="1" stop-color="#8a6420"/></linearGradient></defs>
    <circle cx="100" cy="100" r="92" fill="none" stroke="url(#gold)" stroke-width="3"/>
    <circle cx="100" cy="100" r="84" fill="none" stroke="url(#gold)" stroke-width="1"/>
    <path d="M100 30 L150 160 L136 160 L100 64 L64 160 L50 160 Z" fill="url(#gold)"/>
    <path d="M76 118 H124 L120 128 H80 Z" fill="url(#gold)"/>
    <path d="M100 172 l6 8 -6 8 -6 -8 z" fill="url(#gold)"/></svg>`;

  C.scene('reveal', 0, C.duration, s => {
    s.bg('radial', { from: '#1d1a12', to: '#070707', size: 75 });
    s.particles({ type: 'dust', colors: ['#f1d78c', '#c9a24f'], count: 70, size: .7 });
    // 1. a single light line draws across the frame (anticipation)
    const line = s.el('<div style="height:2px;background:linear-gradient(90deg,transparent,#f1d78c,transparent)"></div>', { x: .5, y: .5, w: .8 });
    s.tween(line, .2, 1.1, 'cinematic', (e, st) => { st.sx *= e; st.o *= 1 - Math.max(0, (e - .7) / .3); });
    C.cue(.2, 'riser', { dur: 1.3, gain: .6 });
    // 2. monogram: stroke draw -> gold fill -> light sweep (MS.logo.reveal registers riser + chime cues)
    const mark = MS.logo.reveal(s, MARK, { y: .4, size: .5, at: 1.0, draw: 1.3, stroke: '#f1d78c', strokeWidth: 1.2, cue: false });
    s.anim(mark, 'blurIn', 1.0, { dur: 1.2, amount: 1.5 });
    C.cue(2.45, 'chime'); C.cue(2.45, 'boom', { gain: .5 });
    s.particles({ type: 'sparks', at: 2.45, y: .4, colors: ['#f6e2a0', '#fff'], count: 70, speed: 30, cue: false });
    // 3. wordmark tracks in, tagline follows
    const word = s.text('Aurelia', { size: 'h1', y: .79 });
    s.anim(word, 'tracking', 2.6, { from: 1.1, to: .18, dur: 1.8 });
    const tag = s.text('Maison de parfum · Paris', { size: 'caption', font: 'body', y: .93, color: 'var(--muted)', tracking: .3 });
    s.anim(tag, 'fadeIn', 3.6, { dur: .9 });
    s.push(.05, { from: .8, to: C.duration });
  }, { energy: .6, hold: true, purpose: 'logo reveal' });
});
</script>
</body></html>
